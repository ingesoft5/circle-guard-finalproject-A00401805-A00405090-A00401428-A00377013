# CG-DOC: GitHub Actions workflow: enforce-pr.
name: Enforce Pull Request

on:
  push:
    branches: [ "main" ]

jobs:
  check-pr:
    name: Verificar origen de cambios
    runs-on: ubuntu-latest
    steps:
      - name: Validar que el push proviene de un Pull Request
        run: |
          # Si el commit no contiene la firma de un Merge de PR, falla
          if [[ "${{ github.event.head_commit.message }}" != *"Merge pull request"* ]] && [[ "${{ github.event.head_commit.message }}" != *"Squash and merge"* ]]; then
            echo "ERROR: Se detectó un 'push' directo a la rama main."
            echo "En este repositorio los cambios deben realizarse a través de un Pull Request."
            exit 1
          fi
          echo "Verificación exitosa: Cambio integrado mediante Pull Request."
