# CG-DOC: GitHub <-> Jira DCG integration (no org-level GitHub app required).
# Mirrors repository events into Jira asynchronously so PRs are not delayed.
name: Jira sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify"
        required: true
        default: verify
        type: choice
        options: [verify]
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify-jira:
    name: Verify Jira credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify API token and DCG project
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 scripts/jira_sync.py --verify

  sync-jira:
    name: Mirror event to Jira
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync event via Jira REST API
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping sync."
            exit 0
          fi
          python3 scripts/jira_sync.py \
            --event "${{ github.event_name }}" \
            --payload "$GITHUB_EVENT_PATH" \
            --mapping docs/agil/jira-mapping.yml

      - name: Ensure Jira evidence issues exist
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping issue creation."
            exit 0
          fi
          python3 scripts/jira_sync.py --create-issues --issues-file docs/agil/jira-issues-to-create.json

      - name: Assign sprints to Jira issues
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping sprint assignment."
            exit 0
          fi
          python3 scripts/jira_sync.py --assign-sprints --assignments-file docs/agil/jira-sprint-assignment.json
