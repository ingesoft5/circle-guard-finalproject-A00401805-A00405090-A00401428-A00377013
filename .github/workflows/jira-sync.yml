# CG-DOC: GitHub <-> Jira DCG integration (no org-level GitHub app required).
# Validates that every PR body carries a Jira key and mirrors PR events into Jira.
name: Jira sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify"
        required: true
        default: verify
        type: choice
        options: [verify]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify-jira:
    name: Verify Jira credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify API token and DCG project
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 scripts/jira_sync.py --verify

  validate-pr-body:
    name: Jira key in PR body
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check DCG identifier
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ["PR_BODY"]
          if not re.search(r"\bDCG-\d+\b", body, re.IGNORECASE):
              print(
                  "ERROR: PR #%s body must include the Jira story key (DCG-###).\n"
                  "Add the identifier to the Jira Ticket field of the PR template." % (
                      os.environ["PR_NUMBER"],
                  ),
                  file=sys.stderr,
              )
              sys.exit(1)
          print("OK: Jira key found in PR body:", re.search(r"\bDCG-\d+\b", body, re.I).group(0))
          PY

  sync-jira:
    name: Mirror event to Jira
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync event via Jira REST API
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping sync."
            exit 0
          fi
          python3 scripts/jira_sync.py \
            --event "${{ github.event_name }}" \
            --payload "$GITHUB_EVENT_PATH" \
            --mapping docs/agil/jira-mapping.yml

      - name: Ensure Jira evidence issues exist
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping issue creation."
            exit 0
          fi
          python3 scripts/jira_sync.py --create-issues --issues-file docs/agil/jira-issues-to-create.json

      - name: Assign sprints to Jira issues
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Jira secrets are not configured in this repository; skipping sprint assignment."
            exit 0
          fi
          python3 scripts/jira_sync.py --assign-sprints --assignments-file docs/agil/jira-sprint-assignment.json
