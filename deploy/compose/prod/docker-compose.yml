# CG-DOC: Docker Compose definition for the prod environment.
services:
  redis:
    image: redis:7.2-alpine
    container_name: cg-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod:/data
    networks: [prod-net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: cg-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: circleguard_auth
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: circleguard_identity,circleguard_promotion,circleguard_form
    volumes:
      - postgres_prod:/var/lib/postgresql/data
      - ../postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks: [prod-net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d circleguard_auth"]
      interval: 10s
      timeout: 5s
      retries: 15

  neo4j:
    image: neo4j:5.26-community
    container_name: cg-neo4j-prod
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_prod:/data
    networks: [prod-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  kafka:
    image: apache/kafka:3.7.0
    container_name: cg-kafka-prod
    restart: unless-stopped
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${ENV_HOST_IP:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "29092:29092"
    volumes:
      - kafka_prod:/var/lib/kafka/data
    networks: [prod-net]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: cg-openldap-prod
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: CircleGuard
      LDAP_DOMAIN: circleguard.edu
      LDAP_ADMIN_PASSWORD: ${OPENLDAP_ADMIN_PASSWORD}
    volumes:
      - openldap_prod:/var/lib/ldap
      - openldap_config_prod:/etc/ldap/slapd.d
    networks: [prod-net]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -D \"cn=admin,dc=circleguard,dc=edu\" -w \"$$LDAP_ADMIN_PASSWORD\" -H ldap://localhost -b dc=circleguard,dc=edu -s base >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15

  auth:
    image: ${NEXUS_REGISTRY}/circleguard-docker/auth:${TAG}
    container_name: cg-auth-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8180
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_auth
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_LDAP_URLS: ldap://openldap:389
      SPRING_LDAP_USERNAME: cn=admin,dc=circleguard,dc=edu
      SPRING_LDAP_PASSWORD: ${OPENLDAP_ADMIN_PASSWORD}
      IDENTITY_SERVICE_URL: http://identity:8083/api/v1/identities/map
      IDENTITY_SERVICE_FALLBACK_ENABLED: "true"
      MANAGEMENT_HEALTH_LDAP_ENABLED: "false"
      QR_SECRET: ${QR_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [prod-net]
    mem_limit: 448m

  identity:
    image: ${NEXUS_REGISTRY}/circleguard-docker/identity:${TAG}
    container_name: cg-identity-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_identity
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      VAULT_SECRET: ${VAULT_SECRET}
      VAULT_SALT: ${VAULT_SALT}
      VAULT_HASH_SALT: ${VAULT_HASH_SALT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [prod-net]
    mem_limit: 448m

  promotion:
    image: ${NEXUS_REGISTRY}/circleguard-docker/promotion:${TAG}
    container_name: cg-promotion-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_promotion
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: validate
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [prod-net]
    mem_limit: 768m

  form:
    image: ${NEXUS_REGISTRY}/circleguard-docker/form:${TAG}
    container_name: cg-form-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_form
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [prod-net]
    mem_limit: 448m

  gateway:
    image: ${NEXUS_REGISTRY}/circleguard-docker/gateway:${TAG}
    container_name: cg-gateway-prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8087
      QR_SECRET: ${QR_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [prod-net]
    mem_limit: 448m

  web:
    image: ${NEXUS_REGISTRY}/circleguard-docker/web:${TAG}
    container_name: cg-web-prod
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [prod-net]
    mem_limit: 64m

volumes:
  redis_prod:
  postgres_prod:
  neo4j_prod:
  kafka_prod:
  openldap_prod:
  openldap_config_prod:

networks:
  prod-net:
    driver: bridge
