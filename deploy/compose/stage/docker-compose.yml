services:
  redis:
    image: redis:7.2-alpine
    container_name: cg-redis-stage
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_stage:/data
    networks: [stage-net]
    mem_limit: 128m

  gateway:
    image: ${NEXUS_REGISTRY}/circleguard-docker/gateway:${TAG}
    container_name: cg-gateway-stage
    restart: unless-stopped
    depends_on: [redis]
    environment:
      SPRING_PROFILES_ACTIVE: stage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8087
      QR_SECRET: ${QR_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8088:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [stage-net]
    mem_limit: 512m

volumes:
  redis_stage:

networks:
  stage-net:
    driver: bridge
