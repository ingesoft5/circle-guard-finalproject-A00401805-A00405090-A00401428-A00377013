# CG-DOC: Jenkins Configuration as Code for security, credentials, library, and job.
jenkins:
  systemMessage: "CircleGuard CI/CD"
  # Two executors: four concurrent Gradle + Testcontainers builds pushed this host to
  # load ~13 with swap in use, which made container health checks time out.
  numExecutors: 2
  # Pipelines need the recipients in env, not only in the Jenkins container process
  # environment, so failure notifications work without a reload-time workaround.
  globalNodeProperties:
    - envVars:
        env:
          - key: "EMAIL_RECIPIENTS"
            value: "${EMAIL_RECIPIENTS}"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: professor
          password: ${PROFESSOR_PASSWORD}
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - "Overall/Administer"
        - user:
            name: professor
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              description: GitHub
          - string:
              scope: GLOBAL
              id: github-webhook-secret
              secret: ${GITHUB_WEBHOOK_SECRET}
              description: GitHub webhook secret
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: ${SONAR_TOKEN}
              description: SonarQube
          - usernamePassword:
              scope: GLOBAL
              id: nexus-creds
              username: ${NEXUS_USER}
              password: ${NEXUS_PASSWORD}
              description: Nexus

unclassified:
  location:
    url: ${JENKINS_URL}
    adminAddress: ${MAIL_FROM}
  mailer:
    smtpHost: ${SMTP_HOST}
    smtpPort: ${SMTP_PORT}
    useSsl: false
    useTls: true
    useSMTPAuth: true
    smtpAuthUserName: ${SMTP_USER}
    smtpAuthPasswordSecret: ${SMTP_PASSWORD}
  gitHubPluginConfig:
    # Webhook relay until a dedicated domain exists: GitHub cannot reach the
    # on-premise host, so events arrive through smee.io (see
    # docs/infra/migracion-onpremise.md, section 3.6).
    hookUrl: "${SMEE_URL}"
    configs:
      - name: "GitHub"
        credentialsId: "github-creds"
        apiUrl: "https://api.github.com"
        # Jenkins does not rewrite the hook: it is managed manually in GitHub because
        # hookUrl is no longer a public IP of the host.
        manageHooks: false
    hookSecretConfigs:
      - credentialsId: "github-webhook-secret"
  gitHubConfiguration:
    apiRateLimitChecker: ThrottleForNormalize
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: SonarQube
        serverUrl: ${SONAR_HOST_URL}
        credentialsId: sonar-token
  globalLibraries:
    libraries:
      - name: circleguard
        defaultVersion: ${LIBRARY_BRANCH}
        retriever:
          modernSCM:
            libraryPath: jenkins
            scm:
              git:
                remote: ${GITHUB_REPO_URL}
                credentialsId: github-creds

jobs:
  - script: |
      multibranchPipelineJob('circle-guard-finalproject-A00401805-A00405090-A00401428-A00377013') {
        branchSources {
          branchSource {
            source {
              github {
                id('circle-guard-finalproject-A00401805-A00405090-A00401428-A00377013')
                repoOwner('${GITHUB_OWNER}')
                repository('${GITHUB_REPO}')
                credentialsId('github-creds')
                repositoryUrl('${GITHUB_REPO_URL}')
                configuredByUrl(true)
                traits {
                  gitHubBranchDiscovery {
                    strategyId(1)
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                  // No convention filter: GitHub is the single source of truth.
                  // Every existing branch is indexed; a branch merged into main and
                  // deleted disappears on the next index (see orphanedItemStrategy below).
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(0)
            numToKeep(0)
          }
        }
        // The webhook is the primary trigger: push/PR/delete on GitHub -> smee.io
        // -> /github-webhook/. The delete event immediately removes a branch deleted
        // after merging into main. This 20-minute scan is the fallback.
        triggers {
          periodicFolderTrigger {
            interval('20m')
          }
        }
      }
