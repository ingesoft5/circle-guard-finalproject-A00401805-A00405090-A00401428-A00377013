# CG-DOC: Jenkins Configuration as Code for security, credentials, library, and job.
jenkins:
  systemMessage: "CircleGuard CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: professor
          password: ${PROFESSOR_PASSWORD}
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - "Overall/Administer"
        - user:
            name: professor
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              description: GitHub
          - string:
              scope: GLOBAL
              id: github-webhook-secret
              secret: ${GITHUB_WEBHOOK_SECRET}
              description: GitHub webhook secret
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: ${SONAR_TOKEN}
              description: SonarQube
          - usernamePassword:
              scope: GLOBAL
              id: nexus-creds
              username: ${NEXUS_USER}
              password: ${NEXUS_PASSWORD}
              description: Nexus

unclassified:
  location:
    url: ${JENKINS_URL}
  gitHubPluginConfig:
    # Relay del webhook mientras no exista un dominio propio: GitHub no alcanza
    # el host on-prem, asi que el evento entra por el canal de smee.io (ver
    # docs/infra/migracion-onpremise.md, seccion 3.6).
    hookUrl: "${SMEE_URL}"
    configs:
      - name: "GitHub"
        credentialsId: "github-creds"
        apiUrl: "https://api.github.com"
        # Jenkins no reescribe el hook: se administra a mano en GitHub porque
        # hookUrl ya no es una IP publica del host.
        manageHooks: false
    hookSecretConfigs:
      - credentialsId: "github-webhook-secret"
  gitHubConfiguration:
    apiRateLimitChecker: ThrottleForNormalize
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: SonarQube
        serverUrl: ${SONAR_HOST_URL}
        credentialsId: sonar-token
  globalLibraries:
    libraries:
      - name: circleguard
        defaultVersion: ${LIBRARY_BRANCH}
        retriever:
          modernSCM:
            libraryPath: jenkins
            scm:
              git:
                remote: ${GITHUB_REPO_URL}
                credentialsId: github-creds

jobs:
  - script: |
      multibranchPipelineJob('circle-guard-finalproject-A00401805-A00405090-A00401428-A00377013') {
        branchSources {
          branchSource {
            source {
              github {
                id('circle-guard-finalproject-A00401805-A00405090-A00401428-A00377013')
                repoOwner('${GITHUB_OWNER}')
                repository('${GITHUB_REPO}')
                credentialsId('github-creds')
                repositoryUrl('${GITHUB_REPO_URL}')
                configuredByUrl(true)
                traits {
                  gitHubBranchDiscovery {
                    strategyId(1)
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                  // Solo indexa ramas activas por convención; los PRs se descubren
                  // por gitHubPullRequestDiscovery (P1.4: main, feature branches y PRs).
                  headWildcardFilter {
                    includes('main master develop feature/* feat/* fix/* bugfix/* hotfix/* release/* chore/* docs/* infra/*')
                    excludes('')
                  }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
        // El webhook es el disparador primario (push/PR en GitHub -> smee.io ->
        // /github-webhook/), pero si no alcanza o Jenkins no procesa el evento,
        // el multibranch nunca ve ramas nuevas. Este es el respaldo: escaneo
        // cada 20 minutos como máximo, para que la rama aparezca sin intervención.
        triggers {
          periodicFolderTrigger {
            interval('20m')
          }
        }
      }
