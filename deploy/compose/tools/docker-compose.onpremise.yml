# CG-DOC: Docker Compose definition for on-premise tooling (Jenkins, SonarQube, Nexus, MinIO, DynamoDB).
# CircleGuard tooling on a single host, without sudo and without SSH.
# Jenkins and the smee.io relay run with network_mode: host; the rest use tools-net.
services:
  jenkins:
    build: ./jenkins
    container_name: cg-jenkins
    restart: unless-stopped
    user: root
    network_mode: host
    env_file:
      - .env.onpremise
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/cac/jenkins.yml
      # JAVA_OPTS stays exported and every gradlew build inherits it (gradlew
      # evaluates $JAVA_OPTS for its JVM); the controller heap is set separately in
      # JENKINS_JAVA_OPTS, which the official entrypoint combines with JAVA_OPTS.
      JAVA_OPTS: ""
      JENKINS_JAVA_OPTS: "-Xms512m -Xmx3g"
      TESTCONTAINERS_HOST_OVERRIDE: "10.147.20.67"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      KUBECONFIG: /var/jenkins_home/.kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/cac:/var/jenkins_home/cac:ro
      # k3d admin kubeconfig (k3d cg kubeconfig write ~/.kube/config). Read-only;
      # cluster writes are made by the pipeline in deploy/k8s/overlays/<env>.
      - ${HOME}/.kube/config:/var/jenkins_home/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    # 4 executors: each build runs gradle+sonar+trivy inside this cgroup;
    # 8g covers the worst case (check free -h before recreating with dev+stage up).
    mem_limit: 8g

  smee-client:
    build: ./smee-client
    container_name: cg-smee-client
    restart: unless-stopped
    network_mode: host
    environment:
      SMEE_URL: ${SMEE_URL}
      SMEE_TARGET: ${SMEE_TARGET:-http://localhost:8080/github-webhook//}
    command: ["-u", "${SMEE_URL}", "-t", "${SMEE_TARGET:-http://localhost:8080/github-webhook//}"]
    depends_on:
      - jenkins
    mem_limit: 256m

  sonar-db:
    image: postgres:16
    container_name: cg-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tools-net]

  sonarqube:
    image: sonarqube:lts-community
    container_name: cg-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_JAVAOPTS: "-Xms512m -Xmx1g"
      SONAR_CE_JAVAOPTS: "-Xms512m -Xmx1g"
      SONAR_SEARCH_JAVAOPTS: "-Xms1g -Xmx1g"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    mem_limit: 3g
    networks: [tools-net]

  nexus:
    image: sonatype/nexus3:3.68.1
    container_name: cg-nexus
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1200m -XX:MaxDirectMemorySize=2g"
    ports:
      - "8081:8081"
      - "5000:5000"
    volumes:
      - nexus_data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    mem_limit: 2g
    networks: [tools-net]

  minio-iac:
    image: cgr.dev/chainguard/minio:latest
    container_name: cg-minio-iac
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${TF_STATE_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${TF_STATE_MINIO_PASSWORD}
    # MinIO community images were withdrawn from Docker Hub and Quay in 2026;
    # Chainguard publishes the same S3-compatible server as a free image.
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_iac_data:/data
    mem_limit: 512m
    networks: [ tools-net ]

  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    container_name: cg-dynamodb-local
    restart: unless-stopped
    # In-memory mode avoids SQLite file locks; Terraform recreates the lock table on bootstrap.
    command: -jar DynamoDBLocal.jar -inMemory -port 8000
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    networks: [ tools-net ]

volumes:
  jenkins_home:
  sonar_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
  minio_iac_data:

networks:
  tools-net:
    name: tools-net
    driver: bridge
