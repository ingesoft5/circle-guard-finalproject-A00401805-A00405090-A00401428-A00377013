# CG-DOC: KEDA ScaledObjects for the L284 FinOps scale-to-zero bonus.
# Isolated cg-finops namespace: mandatory cg-dev services are NOT touched.
# A Prometheus trigger scales file/notification from 0 -> 1 when HTTP traffic
# appears and back to 0 after an idle window, demonstrating real cost saving.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-finops
  namespace: cg-finops
  labels:
    app: file-finops
spec:
  replicas: 0
  selector:
    matchLabels:
      app: file-finops
  template:
    metadata:
      labels:
        app: file-finops
    spec:
      containers:
        - name: file
          image: circleguard-docker/file:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: file-finops
  namespace: cg-finops
  labels:
    app: file-finops
spec:
  selector:
    app: file-finops
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: file-finops-scaler
  namespace: cg-finops
spec:
  scaleTargetRef:
    name: file-finops
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 60
  idleReplicaCount: 0
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: file_http_requests
        query: sum(rate(http_server_requests_seconds_count{app="file-finops"}[1m]))
        threshold: "0.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-finops
  namespace: cg-finops
  labels:
    app: notification-finops
spec:
  replicas: 0
  selector:
    matchLabels:
      app: notification-finops
  template:
    metadata:
      labels:
        app: notification-finops
    spec:
      containers:
        - name: notification
          image: circleguard-docker/notification:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-finops
  namespace: cg-finops
  labels:
    app: notification-finops
spec:
  selector:
    app: notification-finops
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-finops-scaler
  namespace: cg-finops
spec:
  scaleTargetRef:
    name: notification-finops
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 60
  idleReplicaCount: 0
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: notification_http_requests
        query: sum(rate(http_server_requests_seconds_count{app="notification-finops"}[1m]))
        threshold: "0.1"