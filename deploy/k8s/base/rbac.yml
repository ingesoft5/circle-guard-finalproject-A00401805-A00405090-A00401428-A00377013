# CG-DOC: Cuenta de servicio con permisos de despliegue limitados al namespace del overlay.
# Sustituye el uso directo del kubeconfig admin cuando Jenkins adopte este ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: form
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-deployer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-deployer
subjects:
  - kind: ServiceAccount
    name: circleguard-deployer
