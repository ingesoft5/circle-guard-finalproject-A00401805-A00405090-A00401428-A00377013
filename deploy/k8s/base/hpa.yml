# CG-DOC: HorizontalPodAutoscalers for the traffic-facing services (entregable E2.2).
# Requires metrics-server in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl -n kube-system patch deployment metrics-server --type=json \
#     -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
# The HPA owns spec.replicas: scaled Deployments omit it so that
# `kubectl apply -k` does not reset them to 1 on every deployment.
# Stage excludes the Form HPA and declares one replica for the authorized promotion.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
