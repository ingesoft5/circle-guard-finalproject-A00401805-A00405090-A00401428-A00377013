# CG-DOC: External configuration for dashboard-service (E2.2 / E2.4).
# Credentials stay in the cg-secrets Secret generated by each overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  labels:
    app: dashboard
data:
  SERVER_PORT: "8084"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_dashboard
  SPRING_DATASOURCE_USERNAME: admin
  PROMOTION_SERVICE_URL: http://promotion:8088
