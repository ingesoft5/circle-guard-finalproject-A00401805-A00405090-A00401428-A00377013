# CG-DOC: Deployments and Services for the eight CircleGuard services and the web client.
# Images are built locally and imported with `k3d image import -c cg`, so the
# pull policy stays IfNotPresent until the pipeline publishes to Nexus.
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8180
      targetPort: 8180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8180"
    spec:
      containers:
        - name: auth
          image: circleguard-docker/auth:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8180
          envFrom:
            - configMapRef:
                name: cg-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/circleguard_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cg-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_LDAP_URLS
              value: ldap://openldap:389
            - name: SPRING_LDAP_USERNAME
              value: cn=admin,dc=circleguard,dc=edu
            - name: SPRING_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cg-secrets
                  key: OPENLDAP_ADMIN_PASSWORD
            - name: IDENTITY_SERVICE_FALLBACK_ENABLED
              value: "false"
            - name: MANAGEMENT_HEALTH_LDAP_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cg-secrets
                  key: JWT_SECRET
            - name: QR_SECRET
              valueFrom:
                secretKeyRef:
                  name: cg-secrets
                  key: QR_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8180
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8180
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
---
