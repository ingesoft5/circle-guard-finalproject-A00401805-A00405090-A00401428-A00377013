# CG-DOC: RBAC rules for the isolated cg-dev monitoring stack.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: form06-prometheus-reader
  namespace: cg-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: form06-prometheus-reader
  namespace: cg-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: form06-prometheus-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: form06-alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: form06-alloy-logs
  namespace: cg-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: form06-alloy-logs
  namespace: cg-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: form06-alloy-logs
subjects:
  - kind: ServiceAccount
    name: form06-alloy
    namespace: monitoring
