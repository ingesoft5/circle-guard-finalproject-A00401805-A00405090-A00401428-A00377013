# The shared Promtail watches cg-dev/cg-stage/cg-prod and mounts host logs.
# Do not activate it during the isolated Form canary; Alloy tails only form-hu6.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
$patch: delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
$patch: delete
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
$patch: delete
