# CG-DOC: el Ingress pasa del entrypoint `web` al `websecure` de Traefik.
# El certificado se entrega fuera del repositorio; aquí solo se referencia su Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - dev.circleguard.local
        - stage.circleguard.local
        - prod.circleguard.local
      secretName: circleguard-tls
