# CG-DOC: Switches the Ingress from the Traefik `web` entrypoint to `websecure`.
# The certificate is delivered outside the repository; only its Secret is referenced here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - dev.circleguard.local
        - stage.circleguard.local
        - prod.circleguard.local
      secretName: circleguard-tls
