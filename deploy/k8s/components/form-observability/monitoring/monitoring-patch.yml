apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  template:
    spec:
      volumes:
        - name: alert-rules
          configMap: null
          projected:
            sources:
              - configMap:
                  name: auth-prometheus-alerts
              - configMap:
                  name: form-prometheus-alerts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  template:
    spec:
      volumes:
        - name: dashboards
          configMap: null
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-circleguard
              - configMap:
                  name: grafana-dashboard-form
