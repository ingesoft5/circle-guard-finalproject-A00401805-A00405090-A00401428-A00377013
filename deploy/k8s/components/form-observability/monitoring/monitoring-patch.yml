# CG-DOC: Project Form alert rules into the shared Prometheus rules volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  template:
    spec:
      volumes:
        - name: alert-rules
          configMap: null
          projected:
            sources:
              - configMap:
                  name: auth-prometheus-alerts
              - configMap:
                  name: form-prometheus-alerts
