# CG-DOC: promtool unit tests for dashboard-service alert rules.
rule_files:
  - dashboard-alerts.yml
evaluation_interval: 30s
tests:
  - name: dashboard target outage fires and recovers
    interval: 1m
    input_series:
      - series: 'up{app="dashboard",namespace="cg-dev",pod="dashboard-1",service="dashboard"}'
        values: '1+0x2 0+0x5 1+0x5'
      - series: 'up{app="dashboard",namespace="cg-stage",pod="dashboard-1",service="dashboard"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: DashboardServiceDown
        exp_alerts: []
      - eval_time: 5m
        alertname: DashboardServiceDown
        exp_alerts:
          - exp_labels:
              app: dashboard
              namespace: cg-dev
              pod: dashboard-1
              service: dashboard
              severity: critical
            exp_annotations:
              summary: Dashboard service scrape target is down
              description: Prometheus cannot scrape dashboard-service in cg-dev for two minutes. Check the pod, Actuator health and scrape annotations.
      - eval_time: 10m
        alertname: DashboardServiceDown
        exp_alerts: []

  - name: promotion failures fire for dev and ignore stage
    interval: 1m
    input_series:
      - series: 'circleguard_dashboard_promotion_calls_total{app="dashboard",namespace="cg-dev",operation="healthStats",outcome="error",service="dashboard"}'
        values: '0+12x10 120+0x10'
      - series: 'circleguard_dashboard_promotion_calls_total{app="dashboard",namespace="cg-stage",operation="healthStats",outcome="error",service="dashboard"}'
        values: '0+12x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: DashboardPromotionCallFailures
        exp_alerts: []
      - eval_time: 7m
        alertname: DashboardPromotionCallFailures
        exp_alerts:
          - exp_labels:
              namespace: cg-dev
              service: dashboard
              severity: warning
            exp_annotations:
              summary: Dashboard promotion-service calls are failing
              description: At least 0.2 failed calls per second over five minutes, sustained for two minutes. Check promotion-service connectivity and dashboard logs.
      - eval_time: 15m
        alertname: DashboardPromotionCallFailures
        exp_alerts: []
