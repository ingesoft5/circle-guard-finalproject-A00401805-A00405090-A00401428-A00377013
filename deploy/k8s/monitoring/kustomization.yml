# CG-DOC: Kustomize overlay for the CircleGuard monitoring stack (Prometheus, Alertmanager, Grafana).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - alertmanager.yml
  - prometheus.yml
  - grafana.yml

commonLabels:
  app.kubernetes.io/part-of: circleguard
