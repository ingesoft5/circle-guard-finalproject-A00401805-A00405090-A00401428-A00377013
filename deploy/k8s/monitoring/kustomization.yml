# CG-DOC: Kustomize overlay for the CircleGuard monitoring stack (Prometheus, Alertmanager, Grafana, Loki, Promtail).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../components/form-observability/monitoring

resources:
  - namespace.yml
  - alertmanager.yml
  - prometheus.yml
  - grafana.yml
  - loki.yml
  - promtail.yml

commonLabels:
  app.kubernetes.io/part-of: circleguard
