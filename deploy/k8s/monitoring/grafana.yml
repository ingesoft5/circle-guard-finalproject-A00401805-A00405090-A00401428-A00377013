# CG-DOC: Grafana server, Prometheus datasource, and provisioned dashboard for CircleGuard auth-service & platform metrics.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: circleguard
        folder: CircleGuard
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-circleguard
  namespace: monitoring
data:
  circleguard-auth-overview.json: |
    {
      "title": "CircleGuard Auth & Platform Observability",
      "uid": "circleguard-auth-overview",
      "schemaVersion": 38,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Auth Service Status (UP)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{app=\"auth\"}", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Identity Circuit Breaker OPEN",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "resilience4j_circuitbreaker_state{name=\"identityClient\",state=\"open\"}", "legendFormat": "{{namespace}} open" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Auth Login Attempts Rate by Result",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "sum(rate(circleguard_auth_login_attempts_total[5m])) by (result, namespace)", "legendFormat": "{{namespace}} - {{result}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Visitor Handoff Tokens Issued Rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "sum(rate(circleguard_auth_visitor_handoff_total[5m])) by (namespace)", "legendFormat": "{{namespace}} visitor handoffs" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Auth HTTP Latency p95 (s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{app=\"auth\"}[5m])) by (le, uri, namespace))", "legendFormat": "{{namespace}} {{uri}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Auth JVM Heap Used (MB)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{app=\"auth\",area=\"heap\"}) by (pod, namespace) / 1024 / 1024", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-circleguard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
