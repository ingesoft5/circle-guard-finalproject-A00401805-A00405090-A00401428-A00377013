# CG-DOC: Real Chaos Mesh experiments for the L284 chaos-engineering bonus.
# Target is the graded cg-dev gateway; the chaos resource lives in cg-chaos.
# Bounded, one-shot and self-healing: the gateway ReplicaSet recreates the pod.
#
# El alcance de este manifiesto es el experimento PodChaos sobre el gateway;
# NetworkChaos queda fuera del alcance verificado. Consulta el README de evidencia.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: gateway-pod-kill
  namespace: cg-chaos
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - cg-dev
    labelSelectors:
      app: gateway
  duration: "30s"
