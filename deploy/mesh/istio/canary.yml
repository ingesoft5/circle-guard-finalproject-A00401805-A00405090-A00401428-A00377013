# CG-DOC: Canary release bonus (L284). 90/10 weighted routing between the
# stable Form deployment (cg-dev/form, image 1.4.0) and the canary
# (cg-dev/form-hu6, image 1.8.0). Reuses the existing Service endpoint from
# deploy/k8s/form06-dev/canary/form-hu6.yml, so no application image is
# rebuilt here. Both target services are mTLS STRICT (see mtls.yml).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: circleguard-canary-gateway
  namespace: cg-mesh-canary
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "canary.circleguard.local"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: form-canary
  namespace: cg-mesh-canary
spec:
  hosts:
    - "canary.circleguard.local"
  gateways:
    - circleguard-canary-gateway
  http:
    - name: stable-header
      match:
        - headers:
            x-canary:
              exact: "false"
      route:
        - destination:
            host: form.cg-dev.svc.cluster.local
            port:
              number: 8086
          weight: 100
    - name: weighted-canary
      route:
        - destination:
            host: form.cg-dev.svc.cluster.local
            port:
              number: 8086
          weight: 90
        - destination:
            host: form-hu6.cg-dev.svc.cluster.local
            port:
              number: 8086
          weight: 10
      retries:
        attempts: 2
        perTryTimeout: 2s
---
# Match the STRICT PeerAuthentication on the canary service too. Without an
# ISTIO_MUTUAL DestinationRule the sidecar would originate plaintext to a
# STRICT peer and every 10% canary request would fail with 503.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: form-hu6-mtls
  namespace: cg-mesh-canary
spec:
  host: form-hu6.cg-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
