# CG-DOC: Service mesh mTLS bonus (L284). STRICT mTLS is applied ONLY to the
# isolated cg-mesh-canary namespace so the mandatory cg-dev deployment is not
# restarted (the agent node is currently NotReady). ISTIO_MUTUAL
# DestinationRules originate mTLS towards both the stable and canary services.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: circleguard-strict-mtls
  namespace: cg-mesh-canary
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: form-stable-mtls
  namespace: cg-mesh-canary
spec:
  host: form-stable.cg-mesh-canary.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: form-hu6-mtls
  namespace: cg-mesh-canary
spec:
  host: form-hu6.cg-mesh-canary.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
