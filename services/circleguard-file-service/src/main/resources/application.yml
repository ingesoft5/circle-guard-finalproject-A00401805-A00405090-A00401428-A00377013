# CG-DOC: Runtime configuration for the file service. No secrets are stored here.
spring:
  application:
    name: circleguard-file-service

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        # Expose prometheus for scraping; keep health/info for probes and diagnostics.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # Enables /actuator/health/liveness and /actuator/health/readiness.
        enabled: true
      show-details: never
  metrics:
    tags:
      # Shared tag used by Grafana queries and Prometheus filters.
      application: circleguard-file-service
  tracing:
    sampling:
      # 1.0 = sample every request; acceptable for the partial tracing scope.
      probability: 1.0
  otlp:
    tracing:
      # OTLP HTTP receiver from the monitoring stack; override per environment.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

# S3/MinIO connection. Consumed by the future S3 HU; values come only from the environment.
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://minio:9000}
    bucket: ${AWS_S3_BUCKET:circleguard-files}
    region: ${AWS_REGION:us-east-1}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS:true}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

file:
  storage:
    path: ${FILE_STORAGE_PATH:/app/uploads}
