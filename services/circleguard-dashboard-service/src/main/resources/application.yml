# CG-DOC: Runtime resource for the dashboard service: application.yml.
spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_dashboard
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      service: dashboard
      environment: ${DASHBOARD_ENVIRONMENT:local}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  pattern:
    level: "%5p [dashboard,${DASHBOARD_ENVIRONMENT:local},%X{traceId:-},%X{spanId:-}]"
