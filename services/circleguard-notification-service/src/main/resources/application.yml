# CG-DOC: Runtime resource for the notification service: application.yml.
spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: ${NOTIFICATION_TRACING_ENABLED:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  expiration: 300

management:
  tracing:
    enabled: ${NOTIFICATION_TRACING_ENABLED:false}
    sampling:
      probability: ${NOTIFICATION_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${NOTIFICATION_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    # El SMTP es externo y puede no estar disponible durante el arranque; el
    # healthcheck del contenedor debe medir el proceso, no la dependencia de correo.
    mail:
      enabled: false

server:
  port: 8082
