# CG-DOC: Runtime resource for the form service: application.yml.
spring:
  application:
    name: circleguard-form-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/circleguard_form}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8086

jwt:
  secret: ${JWT_SECRET}

form:
  outbox:
    ack-timeout-ms: ${FORM_OUTBOX_ACK_TIMEOUT_MS:3000}
    retry-attempts: ${FORM_OUTBOX_RETRY_ATTEMPTS:3}
    retry-wait-ms: ${FORM_OUTBOX_RETRY_WAIT_MS:500}
    poll-ms: ${FORM_OUTBOX_POLL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    enabled: ${FORM_TRACING_ENABLED:false}
    sampling:
      probability: ${FORM_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${FORM_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: form
      environment: ${FORM_ENVIRONMENT:local}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.springframework.web: INFO
  pattern:
    level: "%5p [form,${FORM_ENVIRONMENT:local},%X{traceId:-},%X{spanId:-}]"
