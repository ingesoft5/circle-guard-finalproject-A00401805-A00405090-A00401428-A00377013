spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}

qr:
  secret: ${QR_SECRET:my-qr-secret-key-for-dev-1234567890}

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
