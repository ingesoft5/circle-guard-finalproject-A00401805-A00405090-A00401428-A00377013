# CG-DOC: Runtime resource for the gateway service: application.yml.
spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

jwt:
  secret: ${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}

qr:
  secret: ${QR_SECRET:my-qr-secret-key-for-dev-1234567890}

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        # Expose prometheus for scraping; keep health/info for probes and diagnostics.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # Enables /actuator/health/liveness and /actuator/health/readiness.
        enabled: true
  metrics:
    tags:
      # Shared tag used by Grafana queries and Prometheus filters.
      application: circleguard-gateway-service
  tracing:
    sampling:
      # 1.0 = sample every request; acceptable for the partial tracing scope.
      probability: 1.0
  otlp:
    tracing:
      # Jaeger all-in-one OTLP HTTP receiver inside the monitoring namespace.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
