# CG-DOC: Runtime resource for the auth service: application.yml.
spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/circleguard_auth}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  ldap:
    urls: ${SPRING_LDAP_URLS:ldap://localhost:389}
    base: ${SPRING_LDAP_BASE:dc=circleguard,dc=edu}
    username: ${SPRING_LDAP_USERNAME:cn=admin,dc=circleguard,dc=edu}
    password: ${SPRING_LDAP_PASSWORD:admin}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083/api/v1/identities/map}
    fallback-enabled: ${IDENTITY_SERVICE_FALLBACK_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  secret: ${QR_SECRET:5367566B5970337336763979244226452948404D635166546A576E5A72347537}
  expiration: ${QR_EXPIRATION:300}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

server:
  port: ${SERVER_PORT:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    ldap:
      enabled: ${MANAGEMENT_HEALTH_LDAP_ENABLED:false}

resilience4j:
  circuitbreaker:
    instances:
      identityClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_IDENTITY_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${CB_IDENTITY_MIN_CALLS:5}
        failure-rate-threshold: ${CB_IDENTITY_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${CB_IDENTITY_WAIT_DURATION_OPEN:10s}
        permitted-number-of-calls-in-half-open-state: ${CB_IDENTITY_HALF_OPEN_CALLS:3}
  retry:
    instances:
      identityClient:
        max-attempts: ${RETRY_IDENTITY_MAX_ATTEMPTS:3}
        wait-duration: ${RETRY_IDENTITY_WAIT_DURATION:500ms}
