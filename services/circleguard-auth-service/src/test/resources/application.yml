jwt:
  secret: "my-super-secret-test-key-32-chars-long"
  expiration: 3600000

qr:
  secret: "my-super-secret-qr-test-key-32-chars-long"
  expiration: 60000

identity:
  service:
    url: "http://localhost:8083/api/v1/identities/map"

spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
