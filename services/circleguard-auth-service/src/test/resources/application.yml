# CG-DOC: Unit or integration tests for application in the auth service.
jwt:
  secret: "my-super-secret-test-key-32-chars-long"
  expiration: 3600000

qr:
  secret: "my-super-secret-qr-test-key-32-chars-long"
  expiration: 300

identity:
  service:
    url: "http://localhost:8083/api/v1/identities/map"

cors:
  allowed-origins: "http://localhost:8081,http://localhost:8080"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    ldap:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      identityClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_IDENTITY_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${CB_IDENTITY_MIN_CALLS:5}
        failure-rate-threshold: ${CB_IDENTITY_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${CB_IDENTITY_WAIT_DURATION_OPEN:10s}
        permitted-number-of-calls-in-half-open-state: ${CB_IDENTITY_HALF_OPEN_CALLS:3}
  retry:
    instances:
      identityClient:
        max-attempts: ${RETRY_IDENTITY_MAX_ATTEMPTS:3}
        wait-duration: ${RETRY_IDENTITY_WAIT_DURATION:500ms}

spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
