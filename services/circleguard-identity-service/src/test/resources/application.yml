# CG-DOC: Unit or integration tests for application in the identity service.
spring:
  profiles:
    active: test
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092

vault:
  secret: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536" # hex for "test-secret-..."
  salt: "deadbeef"      # hex for encryption
  hash-salt: "12345678" # hex for hashing

jwt:
  secret: "test-jwt-secret-32-chars-long-12345678"

cors:
  allowed-origins: "http://localhost:8081,http://localhost:8080"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      identityAuditKafka:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    retry-aspect-order: 2
    instances:
      identityAuditKafka:
        max-attempts: 3
        wait-duration: 10ms
