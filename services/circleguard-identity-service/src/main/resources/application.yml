# CG-DOC: Runtime resource for the identity service: application.yml.
spring:
  application:
    name: circleguard-identity-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

vault:
  secret: ${VAULT_SECRET}
  salt: ${VAULT_SALT}
  hash-salt: ${VAULT_HASH_SALT}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${SERVER_PORT:8083}

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      identityAuditKafka:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_IDENTITY_AUDIT_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${CB_IDENTITY_AUDIT_MIN_CALLS:5}
        failure-rate-threshold: ${CB_IDENTITY_AUDIT_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${CB_IDENTITY_AUDIT_WAIT_DURATION_OPEN:10s}
        permitted-number-of-calls-in-half-open-state: ${CB_IDENTITY_AUDIT_HALF_OPEN_CALLS:3}
  retry:
    retry-aspect-order: 2
    instances:
      identityAuditKafka:
        max-attempts: ${RETRY_IDENTITY_AUDIT_MAX_ATTEMPTS:3}
        wait-duration: ${RETRY_IDENTITY_AUDIT_WAIT_DURATION:500ms}
