# CG-DOC: SonarQube project settings for the Expo mobile client.
# Paths are relative to the repository root because sonar-scanner is invoked from there.
sonar.projectKey=circleguard-mobile
sonar.projectName=CircleGuard Mobile
sonar.projectVersion=1.0.0

sonar.sources=mobile/hooks,mobile/utils,mobile/constants,mobile/components
sonar.tests=mobile/hooks,mobile/utils,mobile/constants,mobile/components
sonar.test.inclusions=mobile/**/*.test.ts,mobile/**/*.test.tsx,mobile/**/__tests__/**
sonar.exclusions=mobile/**/*.test.ts,mobile/**/*.test.tsx,mobile/**/__tests__/**,mobile/**/*.web.ts,mobile/**/*.web.tsx,mobile/**/*.d.ts

sonar.javascript.lcov.reportPaths=mobile/coverage/lcov.info
sonar.sourceEncoding=UTF-8
