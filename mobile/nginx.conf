# CG-DOC: Sirve el export estático de Expo Router y resuelve rutas sin extensión.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo Router genera login.html, questionnaire.html, etc. Sin este fallback,
    # una navegación directa a /login devolvería 404 en Nginx.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
